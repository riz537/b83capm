_schema-version: 3.3.0
ID: b83capmapp
description: A simple CAP project.
version: 1.0.0
modules:
- name: b83capmapp-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: b83capmapp-auth
  - name: b83capmapp-db
  - name: b83capmapp-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: b83capmapp-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: b83capmapp-db
  parameters:
    buildpack: nodejs_buildpack
- name: b83capmapp-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: b83capmapp-auth
  - name: srv-api
  - name: b83capmapp-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  parameters:
    config:
      destinations:
      - Authentication: NoAuthentication
        DynamicDestination: true
        ForwardAuthToken: true
        Name: srv-api
        ProxyType: Internet
        Type: HTTP
        URL: ~{srv-api/srv-url}
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - ordermgmtui.zip
      name: b83capmappordermgmtui
      target-path: app/
    - artifacts:
      - prdmgmtui.zip
      name: b83capmappprdmgmtui
      target-path: app/
    - artifacts:
      - comdemostorealp.zip
      name: comdemostorealp
      target-path: app/
- name: b83capmappordermgmtui
  type: html5
  path: app/ordermgmtui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: b83capmappprdmgmtui
  type: html5
  path: app/prdmgmtui
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: b83capmapp-destinations
  type: com.sap.application.content
  requires:
  - name: b83capmapp-auth
    parameters:
      service-key:
        name: b83capmapp-auth-key
  - name: b83capmapp-html5-repo-host
    parameters:
      service-key:
        name: b83capmapp-html5-repo-host-key
  - name: srv-api
  - name: b83capmapp-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: b83capmapp-html5-repository
          ServiceInstanceName: b83capmapp-html5-repo-host
          ServiceKeyName: b83capmapp-html5-repo-host-key
          sap.cloud.service: b83capmapp.service
        - Authentication: OAuth2UserTokenExchange
          Name: b83capmapp-auth
          ServiceInstanceName: b83capmapp-auth
          ServiceKeyName: b83capmapp-auth-key
          sap.cloud.service: b83capmapp.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: comdemostorealp
  type: html5
  path: app/storealp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: b83capmapp-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      role-collections:
      - description: generated
        name: Owner (b83capmapp ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Owner
      - description: generated
        name: Employee (b83capmapp ${org}-${space})
        role-template-references:
        - $XSAPPNAME.Employee
      - description: generated
        name: userattributes (b83capmapp ${org}-${space})
        role-template-references:
        - $XSAPPNAME.userattributes
      tenant-mode: dedicated
      xsappname: b83capmapp-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: b83capmapp-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: b83capmapp-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: b83capmapp-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
